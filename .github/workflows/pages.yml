# 每次推送到 main：跑冒烟测试 → 构建单文件版 → 发布到 GitHub Pages（在线版 + 单文件版下载）
# 第一次使用需要在仓库 Settings → Pages 里把 Source 设为「GitHub Actions」
name: 测试并发布

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    # 固定在 Ubuntu 24.04：ubuntu-latest 正在换到 26，这个版本的 Playwright 在新系统上装不了浏览器依赖
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 Playwright
        timeout-minutes: 8
        run: |
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium || (sleep 20 && python -m playwright install --with-deps chromium)
      - name: 单文件版是最新的
        run: python build.py --check
      - name: 冒烟测试（开发版 + 单文件版）
        run: python tests/smoke.py
      - name: 版式截图对比
        run: python tests/visual.py
      - name: 上传截图对比结果
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-out
          path: tests/visual-out/

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 组装站点
        run: |
          mkdir -p _site
          cp -r index.html css js licenses _site/
          python build.py -o _site/SlideGrid.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
