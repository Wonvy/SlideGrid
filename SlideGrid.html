:root {
  --bg: #0e1014;

* { box-sizing: border-box; }

html, body {

/* ---------- 布局 ---------- */

.sidebar { background: var(--panel); overflow-y: auto; min-height: 0; }

/* ---------- 按钮 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--line-2);
  background: var(--panel-2);

.slide-list { list-style: none; margin: 0; padding: 0; }

.slide-item:hover { background: var(--panel-2); }
.slide-item.hl { background: rgba(124, 140, 255, .14); box-shadow: inset 0 0 0 1px rgba(124, 140, 255, .5); }

/* 列表视图 */
.slide-list.list .slide-item {
  display: grid; grid-template-columns: minmax(78px, 44%) minmax(0, 1fr) auto;

.slide-list.grid .slide-info { padding: 0 2px 1px; }

.slide-list.grid .remove { position: absolute; top: 7px; right: 7px; background: rgba(14, 16, 20, .78); color: #fff; }

.slide-thumb {
  position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 5px; overflow: hidden;
  background: #000; display: flex; align-items: center; justify-content: center;

.slides-foot { padding: 8px 14px; border-top: 1px solid var(--line); color: var(--faint); font-size: 12px; }

.stage {

  display: flex; align-items: center; justify-content: center;

    var(--bg);
  overflow: hidden;
}

}

.text-editor {
  position: absolute; z-index: 4; margin: 0; padding: 0; border: 0; outline: 1px dashed var(--accent);

}

.note.compact { margin: 0; }
.section-head { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }

.layout-btn.active { color: var(--text); border-color: var(--accent); background: rgba(124, 140, 255, .1); }
.layout-btn.active .layout-icon { color: var(--accent); }
.layout-icon { width: 48px; height: 30px; color: #5d6576; }
.layout-icon svg { width: 100%; height: 100%; display: block; }
.layout-name { font-size: 12px; }

/* 控件 */
.ctrl {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  column-gap: 8px;
  row-gap: 4px;
  margin: 0 -6px 4px;
  padding: 4px 6px;

  transition: background .12s;
}
.ctrl:hover { background: rgba(255, 255, 255, .03); }

.ctrl-label { color: var(--muted); font-size: 12px; user-select: none; }
.ctrl-value { color: var(--text); font-size: 12px; font-variant-numeric: tabular-nums; }
.ctrl input[type=range] { grid-column: 1 / -1; }
.ctrl.inline .ctrl-actions { display: flex; align-items: center; gap: 8px; }
/* ================= 面板控件（参照 Screen Studio 风格） =================
 * 数值条：名称在左、数值在右，底色按比例填充，左右拖动整条调整
 * 分段按钮 / 下拉 / 颜色 / 字体：名称在上方，控件占满整行
 * 数字：名称和数值在同一个输入条里；half 的两个并排
 */
.ctrls { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }

.ctrls > .ctrl[hidden] { display: none; }

  display: flex; align-items: center; gap: 8px; min-height: 36px; margin: 0; padding: 0;
  background: none; border-radius: 10px;

.ctrls .ctrl:hover { background: none; }

.sfield-fill { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(255, 255, 255, .06); border-right: 2px solid rgba(255, 255, 255, .22); pointer-events: none; }

/* 数字输入条 */
.ctrls .ctrl.nfield { height: 40px; padding: 0 6px 0 14px; background: var(--panel-2); }
.ctrls .ctrl.nfield .ctrl-label { color: var(--muted); flex: none; }

.ctrls .ctrl.nfield.wheel-armed { box-shadow: inset 0 0 0 1px var(--accent); }
.ctrls .ctrl-unit { color: var(--faint); font-size: 12px; }
/* 开关行 */
.ctrls .ctrl-toggle { min-height: 36px; }

/* 分段按钮 */
.seg { display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--panel-2); }
.seg-btn {
  flex: 1; min-width: 0; height: 32px; padding: 0 6px; border: 0; border-radius: 8px; background: transparent;
  color: var(--muted); font-size: 13px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.seg-btn:hover { color: var(--text); }
.seg-btn.active { background: #2c3240; color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(0, 0, 0, .35); }
.ctrls .ctrl.stacked.wheel-armed .seg, .ctrls .ctrl.stacked.wheel-armed .select { box-shadow: inset 0 0 0 1px var(--accent); }

  flex: 1; min-width: 0; height: 40px; padding: 0 12px; border: 0; border-radius: 10px; background: var(--panel-2);
  color: var(--text); font: inherit; font-size: 13px; font-weight: 600; letter-spacing: .3px;
}

.ctrls .ctrl.stacked.wheel-armed .hex-input { box-shadow: inset 0 0 0 1px var(--accent); }
/* 图片 */
.ctrls .image-ctrl { flex-wrap: wrap; }
.ctrls .image-ctrl > .img-thumb { flex-basis: 100%; }
/* 分组标题：14px 粗体，箭头在右（展开朝上），分组之间细线 */
.ctrl-group {
  margin: 10px 0 2px; padding-top: 16px !important; border-top: 1px solid var(--line) !important;
}
.ctrl-group:first-child { margin-top: 0; padding-top: 0 !important; border-top: 0 !important; }
button.ctrl-group > span { flex: 1; }
button.ctrl-group .icon { color: var(--muted); transform: rotate(180deg); }
button.ctrl-group.collapsed .icon { transform: rotate(0deg); }

input[type=range] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 16px; margin: 0; background: transparent; cursor: pointer;
}

  -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px;
  border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .5);
}

input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: #fff; }

.select {
  background: var(--panel-2); color: var(--text);
  border: 1px solid var(--line-2); border-radius: 7px;
  padding: 4px 8px; font: inherit; font-size: 12px; min-width: 128px;
}

.switch {
  appearance: none; -webkit-appearance: none; margin: 0; flex: none;
  width: 40px; height: 24px; border-radius: 12px; background: #3a4050;
  position: relative; cursor: pointer; transition: background .15s;
}

  content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
  border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .4); transition: transform .15s;
}
.switch:checked { background: #e7e9ee; }
.switch:checked::after { background: #111318; transform: translateX(16px); }

input[type=color] {
  -webkit-appearance: none; appearance: none;
  width: 40px; height: 22px; padding: 0; cursor: pointer;
  border: 1px solid var(--line-2); border-radius: 6px; background: none;
}

.export-info { color: var(--faint); font-size: 12px; margin: 10px 0; font-variant-numeric: tabular-nums; }

/* ---------- 浮层 ---------- */
.drop-overlay {
  position: fixed; inset: 0; z-index: 50; pointer-events: none;
  display: none; align-items: flex-start; justify-content: center;
  box-shadow: inset 0 0 0 3px var(--accent);
  background: rgba(124, 140, 255, .06);
}
.drop-overlay.show { display: flex; }
.drop-label {
  margin-top: 64px; padding: 8px 16px; border-radius: 999px;
  background: var(--accent); color: #fff; font-weight: 600;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
}

.toast {
  position: fixed; left: 50%; bottom: 28px; z-index: 60;
  transform: translate(-50%, 12px);
  padding: 8px 14px; border-radius: 9px;
  background: #262b36; border: 1px solid var(--line-2);
  box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.error { border-color: rgba(255, 107, 107, .5); }


/* ---------- 分栏拖拽 ---------- */
.gutter { position: absolute; top: 52px; bottom: 0; width: 8px; z-index: 5; cursor: col-resize; }
.gutter-left { left: calc(var(--left-w, 248px) - 4px); }
.gutter-right { right: calc(var(--right-w, 340px) - 4px); }
.gutter::after {
  content: ""; position: absolute; top: 0; bottom: 0; left: 3px; width: 2px;
  background: transparent; transition: background .15s;
}
.gutter:hover::after, .gutter.active::after { background: var(--accent); }
body.resizing, body.resizing * { cursor: col-resize !important; user-select: none; }

/* ---------- 预览区拖动 ---------- */
.drag-ghost {
  position: fixed; left: 0; top: 0; z-index: 70; pointer-events: none;
  width: 120px; border-radius: 6px; overflow: hidden; opacity: .9;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 0 0 2px var(--accent);
}
.drag-ghost canvas { display: block; width: 100%; height: auto; }

/* ---------- 导出对话框 ---------- */
.modal {
  width: min(860px, calc(100vw - 32px));
  padding: 0; border: 1px solid var(--line-2); border-radius: 14px;
  background: var(--panel); color: var(--text);
  box-shadow: 0 30px 80px rgba(0, 0, 0, .6);
}
.modal::backdrop { background: rgba(5, 6, 9, .6); backdrop-filter: blur(3px); }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; }
.modal-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
.modal-body { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(260px, 1fr); gap: 20px; padding: 6px 16px 16px; }
.preview-wrap {
  display: flex; align-items: center; justify-content: center;
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-height: 220px;
}
.export-preview { max-width: 100%; max-height: 340px; display: block; border-radius: 3px; box-shadow: 0 8px 24px rgba(0, 0, 0, .4); }
.export-preview.checker {
  background: repeating-conic-gradient(#3a3f4b 0 25%, #2a2e37 0 50%) 0 0 / 16px 16px;
}
.export-form { display: flex; flex-direction: column; }
.filename-row { display: flex; align-items: center; gap: 4px; }
.filename-ext { color: var(--faint); font-size: 12px; }
.text-input, .num-input {
  background: var(--panel-2); color: var(--text);
  border: 1px solid var(--line-2); border-radius: 7px;
  padding: 5px 8px; font: inherit; font-size: 12px; outline: none;
}
.text-input { width: 190px; }
.text-input.textarea { width: 100%; grid-column: 1 / -1; resize: vertical; min-height: 54px; font: inherit; line-height: 1.4; padding: 6px 8px; user-select: text; -webkit-user-select: text; }
.ctrl.stacked .ctrl-label { grid-column: 1 / -1; }

/* 检查器：选中对象的标题栏、图层属性、卡片、图层列表 */
.sel-bar {
  display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 2; background: var(--panel);
}
.sel-title { flex: 1; min-width: 0; font-size: 12px; color: var(--text); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layer-add { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 10px; }
.layer-add .btn { justify-content: center; padding-left: 0; padding-right: 0; }

.inspector-count { font-size: 12px; color: var(--faint); }
.layer-list { display: flex; flex-direction: column; gap: 2px; }
.layer-row {
  display: flex; align-items: center; gap: 6px; padding: 3px 4px 3px 6px; border-radius: 6px;
  cursor: pointer; color: var(--muted); font-size: 12px;
}
.layer-row:hover { background: rgba(255, 255, 255, .04); color: var(--text); }
.layer-row.active { background: rgba(124, 140, 255, .14); color: var(--text); }
.layer-row.is-hidden .layer-name, .layer-row.is-hidden .layer-type { opacity: .45; }
.layer-type { display: inline-flex; color: var(--faint); }
.layer-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layer-btn { width: 22px; height: 22px; opacity: 0; }
.layer-row:hover .layer-btn, .layer-btn.on { opacity: 1; }
.layer-btn.on { color: var(--accent); }
.num-input { width: 90px; }
.text-input:focus, .num-input:focus { border-color: var(--accent); }
.ctrl-unit { color: var(--faint); font-size: 12px; }
.modal-foot { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
.foot-left { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.progress { height: 4px; border-radius: 2px; background: var(--line-2); overflow: hidden; max-width: 260px; }
.progress-bar { height: 100%; width: 0; background: var(--accent); transition: width .15s; }
.dialog-status { font-size: 12px; color: var(--muted); }
.dialog-status.error { color: var(--danger); }
@media (max-width: 720px) { .modal-body { grid-template-columns: 1fr; } }

.slide-item.placeholder .slide-thumb { opacity: .45; outline: 1px dashed var(--line-2); outline-offset: -1px; }
.slide-item.placeholder .slide-name { color: var(--faint); font-style: italic; }

/* ---------- 项目 ---------- */
.project-btn {
  display: inline-flex; align-items: center; gap: 6px; max-width: 220px;
  padding: 4px 8px; border: 1px solid transparent; border-radius: 7px;
  background: transparent; cursor: pointer; color: var(--text);
}
.project-btn:hover { background: var(--panel-2); border-color: var(--line-2); }
.project-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.caret { color: var(--faint); font-size: 12px; }
.save-status { color: var(--faint); font-size: 12px; white-space: nowrap; }
.save-status[data-state="未保存"], .save-status[data-state="保存中…"] { color: var(--muted); }
.save-status[data-state="保存失败"], .save-status[data-state="无法使用本地存储"] { color: var(--danger); }

.projects-modal { width: min(960px, calc(100vw - 32px)); }
.project-toolbar { display: flex; align-items: center; gap: 8px; padding: 0 16px 12px; }
.project-toolbar .dialog-status { margin-left: 4px; }
.project-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px;
  padding: 4px 16px 18px; max-height: min(64vh, 640px); overflow-y: auto;
}
.project-card {
  display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px;
  background: var(--panel-2); overflow: hidden; cursor: pointer; transition: border-color .15s, transform .15s;
}
.project-card:hover { border-color: var(--line-2); transform: translateY(-1px); }
.project-card.current { border-color: var(--accent); }
.project-thumb {
  aspect-ratio: 16 / 10; background: var(--bg); display: flex; align-items: center; justify-content: center;
  color: var(--faint); font-size: 12px; border-bottom: 1px solid var(--line);
}
.project-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.project-meta { padding: 8px 10px 2px; }
.project-name { font-weight: 600; display: flex; align-items: center; gap: 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.badge { font-size: 12px; font-weight: 500; color: var(--accent); border: 1px solid rgba(124, 140, 255, .5); border-radius: 4px; padding: 0 4px; }
.project-sub { color: var(--faint); font-size: 12px; margin-top: 2px; }
.project-actions { display: flex; flex-wrap: wrap; gap: 2px; padding: 4px 6px 6px; }
.project-actions .btn { padding: 2px 6px; font-size: 12px; }

/* ---------- 顶栏尺寸下拉 ---------- */
.size-picker { display: flex; align-items: center; gap: 4px; }
.size-picker .ctrl { margin: 0; padding: 0; display: flex; gap: 4px; background: none !important; }
.size-picker .ctrl-label { display: none; }
.size-picker .select { min-width: 0; padding: 5px 6px; }
.size-picker .num-input { width: 72px; padding: 5px 6px; }

/* ---------- 导出悬停面板 ---------- */
.popover {
  position: fixed; z-index: 40; width: 320px; padding: 12px 14px;
  background: var(--panel); border: 1px solid var(--line-2); border-radius: 12px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, .55);
  opacity: 0; transform: translateY(-4px); pointer-events: none;
  transition: opacity .15s, transform .15s;
}
.popover.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
.popover::before { content: ""; position: absolute; top: -10px; left: 0; right: 0; height: 10px; } /* 鼠标从按钮移到面板时不断开 */
.popover-title { font-weight: 600; margin-bottom: 10px; }
.popover-hint { color: var(--faint); font-size: 12px; margin-top: 8px; }
.preview-wrap.small { min-height: 0; padding: 8px; margin-bottom: 10px; }
.export-popover .text-input { width: 170px; }
.export-popover .export-info { margin: 6px 0; }
.export-popover .progress { max-width: none; margin: 6px 0; }

/* ---------- 长图 ---------- */
.stage.long { align-items: flex-start; overflow-y: auto; padding: 96px 0 56px; }
.stage.long .viewport { flex: none; }
.stage.long .stage-hint { position: fixed; bottom: 14px; left: calc((var(--left-w, 248px) + 100vw - var(--right-w, 340px)) / 2); }
.segmented .long-btn { border-left: 1px solid var(--line); border-radius: 0 6px 6px 0; padding-left: 12px; }
.segmented .long-btn.active { border-left-color: transparent; border-radius: 6px; }
.layout-btn.disabled { opacity: .35; cursor: not-allowed; }
.layout-btn.disabled:hover { border-color: var(--line); color: var(--muted); }

/* ---------- 图标（Lucide） ---------- */
.icon { flex: none; display: block; }
.btn .icon { margin-left: -2px; opacity: .9; }
.logo { display: inline-flex; align-items: center; justify-content: center; color: #fff; }
.project-btn .icon-folder-kanban { color: var(--muted); }
.caret { display: inline-flex; color: var(--faint); }
.drop-label { display: inline-flex; align-items: center; gap: 8px; }
.segmented button { display: inline-flex; align-items: center; gap: 4px; }
.project-actions { justify-content: flex-end; gap: 2px; }
.project-actions .icon-btn { color: var(--muted); width: 28px; height: 26px; }
.project-actions .icon-btn:hover { color: var(--text); background: var(--line); }
.project-actions .icon-btn[title="删除项目"]:hover { color: var(--danger); background: rgba(255, 107, 107, .12); }

/* ---------- 背景 ---------- */
/* 透明背景：预览区显示棋盘格（只用于显示，不会导出） */
.viewport.transparent, .export-preview.checker {
  background: repeating-conic-gradient(#3a3f4b 0 25%, #2a2e37 0 50%) 0 0 / 16px 16px;
}
.image-ctrl { grid-template-columns: minmax(0, 1fr) auto; }
.img-thumb {
  grid-column: 1 / -1; height: 72px; border-radius: 7px; overflow: hidden; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg); border: 1px dashed var(--line-2); color: var(--faint); font-size: 12px;
}
.img-thumb:hover { border-color: var(--accent); color: var(--text); }
.img-thumb canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
.file-drag .image-ctrl .img-thumb { border-color: var(--accent); }
.image-ctrl.drop-hover { background: rgba(124, 140, 255, .14); box-shadow: inset 0 0 0 1px var(--accent); }
.popover-hint.warn { color: #f0b35a; }

/* ---------- 预览工具条 ---------- */
.toolbar {
  position: absolute; z-index: 6; top: 64px;
  left: calc(var(--left-w, 248px) + (100% - var(--left-w, 248px) - var(--right-w, 340px)) / 2);
  transform: translateX(-50%);
  display: flex; align-items: center; gap: 6px; padding: 4px;
  background: rgba(21, 24, 30, .92); backdrop-filter: blur(8px);
  border: 1px solid var(--line-2); border-radius: 11px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
}
/* 左侧竖排工具栏 */
.toolstrip {
  position: absolute; z-index: 6; top: 64px; left: calc(var(--left-w, 248px) + 12px);
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px;
  max-height: calc(100% - 120px); overflow-y: auto; scrollbar-width: none;
  background: rgba(21, 24, 30, .92); backdrop-filter: blur(8px);
  border: 1px solid var(--line-2); border-radius: 11px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
}
.toolstrip::-webkit-scrollbar { display: none; }
.app.left-hidden .toolstrip { left: 34px; } /* 让出屏幕边缘的「展开左栏」按钮 */
.toolstrip .tb-btn { width: 34px; min-width: 34px; height: 32px; padding: 0; }
.ts-sep { width: 20px; height: 1px; background: var(--line-2); margin: 3px 0; flex: none; }
.tb-group { display: flex; align-items: center; gap: 2px; }
/* 顶部工具条：宽度不超过工作区，放不下时横向滚动 */
.toolbar { max-width: calc(100% - var(--left-w, 248px) - var(--right-w, 340px) - 140px); overflow-x: auto; scrollbar-width: none; }
.toolbar::-webkit-scrollbar { display: none; }
.toolbar > .tb-group { flex: none; }
.tb-group[hidden] { display: none !important; }
/* 上下文属性：紧凑的横排控件 */
.tb-ctx { gap: 6px; padding-right: 2px; }
.ctx-title { font-size: 12px; color: var(--faint); padding: 0 4px 0 6px; white-space: nowrap; }
.ctx-controls { display: flex; align-items: center; gap: 4px; }
.ctx-controls .ctrl { display: flex; align-items: center; gap: 6px; margin: 0; padding: 2px 6px; border-radius: 7px; white-space: nowrap; }
.ctx-controls .ctrl[hidden] { display: none; }
.ctx-controls .ctrl-label { font-size: 12px; }
.ctx-controls .ctrl-label:empty { display: none; }
.ctx-controls input[type=range] { width: 72px; }
.ctx-controls .ctrl-value { min-width: 34px; }
.ctx-controls .select { width: auto; max-width: 118px; height: 26px; font-size: 12px; }
.ctx-controls .num-input { width: 56px; height: 26px; }
.ctx-controls input[type=color] { width: 26px; height: 22px; }
.ctx-controls .ctrl-group { display: none; }
.ctx-actions { display: flex; align-items: center; gap: 2px; }
.tb-group + .tb-group { padding-left: 6px; border-left: 1px solid var(--line-2); }
.tb-btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  min-width: 32px; height: 30px; padding: 0 6px; border: 0; border-radius: 7px;
  background: transparent; color: var(--muted); cursor: pointer;
}
.tb-btn:hover { background: var(--panel-2); color: var(--text); }
.tb-btn.active { background: var(--accent); color: #fff; }
.tb-btn.disabled { opacity: .3; }
.tb-btn.disabled:hover { background: transparent; color: var(--muted); }
.tb-text { font-size: 12px; padding: 0 8px; }
.tb-zoom {
  min-width: 48px; height: 30px; border: 0; border-radius: 7px; background: transparent;
  color: var(--text); font-size: 12px; font-variant-numeric: tabular-nums; cursor: pointer;
}
.tb-zoom:hover { background: var(--panel-2); }
.stage { padding-top: 48px; }

/* ---------- 折叠 ---------- */
.section-toggle {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 4px 2px 0;
  border: 0; background: none; cursor: pointer; color: var(--muted);
}
.section-toggle:hover, .section-toggle:hover h3 { color: var(--text); }
.section-toggle .icon { transition: transform .15s; color: var(--faint); }
.panel-section.collapsed .section-toggle .icon { transform: rotate(-90deg); }
.panel-section.collapsed .section-body { display: none; }
.panel-section.collapsed { padding-bottom: 10px; }
.panel-section.collapsed .section-head { margin-bottom: 0; }
.panel-section.collapsed .section-head > :not(.section-toggle) { display: none; }
button.ctrl-group {
  display: flex; align-items: center; gap: 6px; width: 100%; padding: 0; border: 0; background: none;
  cursor: pointer; text-align: left; font: inherit; font-size: 14px; font-weight: 600; color: var(--text);
}
button.ctrl-group:hover { color: var(--text); }
button.ctrl-group .icon { transition: transform .15s; }
button.ctrl-group.collapsed .icon { transform: rotate(-90deg); }

/* ---------- 版式标签页 / 我的版式 ---------- */
.tabs { display: flex; gap: 2px; padding: 2px; margin-bottom: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
.tab {
  flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  padding: 5px 6px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; font-size: 12px;
}
.tab:hover { color: var(--text); }
.tab.active { background: var(--panel-2); color: var(--text); box-shadow: 0 0 0 1px var(--line-2); }
.tab-count { font-size: 12px; color: var(--faint); }
.preset-toolbar { display: flex; align-items: center; gap: 4px; margin-bottom: 8px; }
.preset-toolbar .btn { flex: 1; }
.preset-form { display: flex; flex-direction: column; gap: 8px; padding: 10px; margin-bottom: 10px; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 8px; }
.preset-form .text-input { width: 100%; }
.check-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); cursor: pointer; }
.form-actions { display: flex; justify-content: flex-end; gap: 6px; }
.preset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.preset-empty { color: var(--faint); font-size: 12px; line-height: 1.6; padding: 6px 2px; }
.preset-card {
  position: relative; border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
  background: var(--panel-2); cursor: pointer; transition: border-color .15s;
}
.preset-card:hover { border-color: var(--accent); }
.preset-thumb { aspect-ratio: 16 / 10; background: var(--bg); }
.preset-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.preset-meta { padding: 5px 7px 6px; }
.preset-name { font-size: 12px; font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.preset-sub { font-size: 12px; color: var(--faint); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.preset-actions {
  position: absolute; top: 4px; right: 4px; display: flex; gap: 2px; padding: 2px;
  background: rgba(14, 16, 20, .82); border-radius: 6px; opacity: 0; transition: opacity .15s;
}
.preset-card:hover .preset-actions { opacity: 1; }
.preset-actions .icon-btn { width: 22px; height: 22px; color: var(--muted); }
.preset-actions .icon-btn:hover { color: var(--text); background: var(--line); }

/* ---------- 禁止界面文字被选中（点按钮、双击参数名时不会出现蓝色选区） ---------- */
.app, .popover, .modal, .toast, .drop-overlay, .drag-ghost {
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
input[type=text], input[type=number], textarea, [contenteditable] {
  -webkit-user-select: text; user-select: text;
}
button:focus:not(:focus-visible) { outline: none; }

/* 区块标题整行可点击折叠 */
.section-head { cursor: pointer; border-radius: 6px; margin-left: -4px; margin-right: -4px; padding: 2px 4px; transition: background .12s; }
.section-head:hover { background: rgba(255, 255, 255, .03); }
.section-head:hover .section-toggle, .section-head:hover .section-toggle h3 { color: var(--text); }
button.ctrl-group { cursor: pointer; padding-bottom: 4px; }

/* ---------- 卡片缩放手柄 ---------- */
.resize-layer { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.resize-handle {
  position: absolute; left: -6px; top: -6px; width: 12px; height: 12px;
  background: #fff; border: 2px solid var(--accent); border-radius: 3px;
  box-shadow: 0 1px 4px rgba(0, 0, 0, .45); pointer-events: auto;
}
.resize-handle:hover { transform-origin: center; background: var(--accent); }
.rotate-zone { position: absolute; left: -13px; top: -13px; width: 26px; height: 26px; border-radius: 50%; pointer-events: auto; }
.resize-badge {
  position: absolute; left: 0; top: 0; padding: 2px 6px; border-radius: 5px;
  background: rgba(14, 16, 20, .88); color: #fff; font-size: 12px; font-variant-numeric: tabular-nums;
  pointer-events: none; white-space: nowrap;
}

/* ================= 多画板工作区 ================= */
.stage { padding: 0; background: #0b0d11; }
.viewport { position: absolute; inset: 0; box-shadow: none; border-radius: 0; overflow: hidden; }
.stage .stage-hint { z-index: 3; background: rgba(11, 13, 17, .7); padding: 3px 10px; border-radius: 6px; }
.tb-sep { width: 1px; height: 18px; background: var(--line-2); margin: 0 3px; }

/* ================= 顶栏 ================= */
.topbar { gap: 12px; }
.topbar-center { display: flex; justify-content: center; min-width: 0; }
.topbar-group {
  display: inline-flex; align-items: center; gap: 2px; padding: 3px;
  background: var(--bg); border: 1px solid var(--line); border-radius: 9px;
}
.topbar-divider { width: 1px; height: 18px; background: var(--line-2); margin: 0 2px; }
.topbar-btn {
  display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 9px;
  border: 0; border-radius: 6px; background: transparent; color: var(--text); cursor: pointer; font-size: 12.5px;
}
.topbar-btn:hover, .topbar-btn.open { background: var(--panel-2); }
.topbar-btn > .icon { color: var(--muted); }
.topbar-btn > .icon:last-child { color: var(--faint); }
.tb-board-name { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.tb-ratio-text { font-variant-numeric: tabular-nums; min-width: 34px; }
.ratio-slot { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; }
.ratio-shape { display: inline-block; border: 1.5px solid currentColor; border-radius: 2px; color: var(--muted); box-sizing: border-box; }
.ratio-shape.long { border-bottom-style: dashed; }

/* 导出组：尺寸 + 复制 */
.export-group { display: inline-flex; align-items: stretch; height: 32px; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; background: var(--panel-2); }
/* 导出尺寸按钮：名称 + 实际像素 */
.sp-btn {
  display: inline-flex; align-items: center; gap: 6px; height: 100%; padding: 0 8px 0 10px; border: 0;
  background: transparent; color: var(--text); cursor: pointer; white-space: nowrap;
}
.sp-btn:hover, .sp-btn.open { background: rgba(255, 255, 255, .05); }
.sp-name { font-weight: 600; font-size: 12px; }
.sp-dims { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.sp-btn .icon { color: var(--faint); }
.size-menu { min-width: 250px; }
.size-item {
  display: grid; grid-template-columns: 18px 56px 1fr; align-items: center; gap: 6px; width: 100%;
  padding: 7px 10px 7px 6px; border: 0; border-radius: 7px; background: transparent; color: var(--text);
  text-align: left; cursor: pointer; font-size: 12px;
}
button.size-item:hover { background: var(--panel-2); }
.size-item.active .size-name { color: var(--accent); }
.size-check { display: inline-flex; color: var(--accent); }
.size-name { font-weight: 600; }
.size-px { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.size-item.custom { cursor: default; }
.size-custom { display: inline-flex; align-items: center; justify-content: flex-end; gap: 6px; }
.size-input { width: 84px; height: 26px; }
.size-unit { color: var(--faint); }
/* 复制透明背景开关：棋盘格色块，打开时高亮 */
.eg-toggle {
  display: inline-flex; align-items: center; justify-content: center; width: 34px; border: 0;
  border-left: 1px solid var(--line-2); background: transparent; cursor: pointer;
}
.eg-toggle:hover { background: rgba(255, 255, 255, .05); }
.checker-swatch {
  width: 16px; height: 16px; border-radius: 4px; opacity: .45;
  background: repeating-conic-gradient(#8a90a0 0 25%, #3a3f4b 0 50%) 0 0 / 8px 8px;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .2);
}
.eg-toggle.on .checker-swatch { opacity: 1; box-shadow: 0 0 0 2px var(--accent); }
.eg-btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 0 11px; border: 0; border-left: 1px solid var(--line-2);
  background: transparent; color: var(--text); cursor: pointer; font-size: 12.5px;
}
.eg-btn:hover { background: #232835; }
.eg-btn:disabled { opacity: .5; cursor: default; }
.topbar-right #export-btn { height: 32px; }

/* ================= 下拉菜单 ================= */
.menu {
  position: fixed; z-index: 45; min-width: 220px; padding: 6px;
  background: var(--panel); border: 1px solid var(--line-2); border-radius: 11px;
  box-shadow: 0 18px 48px rgba(0, 0, 0, .55);
  opacity: 0; transform: translateY(-4px); pointer-events: none; transition: opacity .12s, transform .12s;
}
.menu.show { opacity: 1; transform: none; pointer-events: auto; }
.menu-title { padding: 4px 8px 6px; font-size: 12px; color: var(--faint); letter-spacing: .3px; }
.menu-sep { height: 1px; margin: 6px 2px; background: var(--line); }
.menu-item {
  display: flex; align-items: center; gap: 8px; width: 100%; min-height: 32px; padding: 0 8px;
  border: 0; border-radius: 7px; background: transparent; color: var(--text); cursor: pointer; font: inherit; font-size: 12.5px; text-align: left;
}
.menu-item:hover { background: var(--panel-2); }
.menu-item.active { background: rgba(124, 140, 255, .12); }
.menu-check { width: 16px; display: inline-flex; justify-content: center; color: var(--accent); }
.menu-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu-meta { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
.menu-actions { display: none; gap: 1px; }
.board-item:hover .menu-actions { display: inline-flex; }
.board-item:hover .menu-meta { display: none; }
.menu-actions .icon-btn.visible { width: 24px; height: 24px; color: var(--muted); }
.board-menu { width: 280px; }

.ratio-menu { width: 296px; }
.ratio-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.ratio-chip {
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 2px 6px;
  border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; font-size: 12px;
}
.ratio-chip:hover { background: var(--panel-2); color: var(--text); }
.ratio-chip.active { border-color: var(--accent); color: var(--text); background: rgba(124, 140, 255, .1); }
.ratio-chip.active .ratio-shape { color: var(--accent); }
.ratio-box { height: 28px; display: flex; align-items: center; justify-content: center; }
.ratio-custom { display: flex; align-items: center; gap: 6px; padding: 2px 6px; }
.ratio-custom .num-input { width: 56px; }
.ratio-custom.active .menu-label { color: var(--accent); }
.ratio-colon { color: var(--faint); }

/* ---------- 工具条：画板背景 ---------- */
.tb-bg { gap: 3px; padding: 0 5px 0 6px; }
.bg-swatch {
  width: 18px; height: 18px; border-radius: 5px; display: block;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .25), 0 0 0 1px rgba(0, 0, 0, .4);
}
.bg-menu { width: 268px; padding: 8px; }
.bg-types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
.bg-type { padding: 5px 0; border: 0; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; }
.bg-type:hover { color: var(--text); }
.bg-type.active { background: var(--panel-2); color: var(--text); box-shadow: 0 0 0 1px var(--line-2); }
.bg-sub { margin: 10px 2px 6px; font-size: 12px; color: var(--faint); }
.bg-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.bg-grid.grads { grid-template-columns: repeat(4, 1fr); }
.bg-chip {
  height: 28px; border: 0; border-radius: 6px; cursor: pointer;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14);
  transition: transform .1s;
}
.bg-chip:hover { transform: scale(1.06); }
.bg-chip.active { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent); }
.bg-custom { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 0 2px; }
.bg-custom .menu-label { flex: 1; font-size: 12px; color: var(--muted); }
.bg-c2 { display: inline-flex; align-items: center; gap: 6px; }
.bg-arrow { color: var(--faint); }
.bg-image-row { margin-top: 8px; }
.bg-image-row .btn { width: 100%; }
/* ---------- 字体选择 ---------- */
.font-btn {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; max-width: 190px; padding: 0 8px;
  border: 1px solid var(--line-2); border-radius: 7px; background: var(--bg); color: var(--text); cursor: pointer;
}
.font-btn:hover, .font-btn.open { border-color: var(--accent); }
.font-btn .icon { flex: none; color: var(--faint); }
.font-btn.missing .font-name { color: #f0b35a; }
.font-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.font-pop { display: flex; flex-direction: column; padding: 8px; gap: 6px; z-index: 60; position: fixed; }
.font-search { width: 100%; }
.font-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; margin: 0 -4px; padding: 0 4px; }
.font-list .menu-title { padding: 8px 6px 4px; }
.font-item {
  display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border: 0; border-radius: 6px;
  background: transparent; color: var(--text); text-align: left; cursor: pointer; font-size: 12px;
}
.font-item:hover, .font-item.kbd { background: var(--panel-2); }
.font-item.active { color: var(--accent); }
.font-preview { flex: 1; min-width: 0; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.font-item.missing .font-preview { opacity: .55; }
.font-tag { font-size: 12px; color: #f0b35a; }
.font-item.use-typed { color: var(--accent); }
.font-foot { display: flex; align-items: center; padding-top: 6px; border-top: 1px solid var(--line); }
.font-foot .btn { width: 100%; justify-content: center; }
.ctx-controls .font-btn { height: 26px; max-width: 150px; }

/* ---------- 工具条：渐隐遮罩 ---------- */
.fade-menu { width: 286px; }
.fade-note { margin: 0 2px 8px; font-size: 12px; color: var(--faint); }
.fade-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.fade-chip {
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 4px 5px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--muted);
  font-size: 12px; cursor: pointer;
}
.fade-chip:hover { color: var(--text); border-color: var(--line-2); }
.fade-chip.active { color: var(--text); border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
/* 预览：一块「幻灯片墙」按遮罩渐隐到深色背景 */
.fade-preview {
  width: 100%; height: 34px; border-radius: 5px; background: #12141a; position: relative; overflow: hidden;
}
.fade-preview::before {
  content: ''; position: absolute; inset: 0;
  background: #7c8cff;
  -webkit-mask-image: var(--mask); mask-image: var(--mask);
}
.panel-section.flash { animation: section-flash .9s ease; }
@keyframes section-flash { 0%, 100% { background: transparent; } 30% { background: rgba(124, 140, 255, .12); } }

/* ================= 右侧面板：版式 / 参数 两个标签页 ================= */
.sidebar.right.right-panel { display: flex; flex-direction: column; overflow: hidden; }
.rp-tabs {
  flex: none; display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 2px;
  margin: 10px 12px 0; padding: 3px; background: var(--bg); border: 1px solid var(--line); border-radius: 9px;
}
.rp-tab {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px;
  border: 0; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; font-weight: 500;
}
.rp-tab:hover { color: var(--text); }
.rp-tab.active { background: var(--panel-2); color: var(--text); box-shadow: 0 0 0 1px var(--line-2), 0 1px 3px rgba(0, 0, 0, .3); }
.rp-pane { flex: 1; min-height: 0; overflow-y: auto; padding-top: 6px; }
.pane-body { padding: 8px 14px 18px; }
.pane-hint { margin: 14px 0 0; text-align: center; }

/* 版式页有整页空间：缩略图更大 */
.rp-pane .picker-grid { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.rp-pane .layout-btn { padding: 10px 4px 8px; gap: 6px; }
.rp-pane .layout-icon { width: 56px; height: 35px; }
.rp-pane .picker-title { margin: 6px 0 8px; }
.rp-pane .picker-title:not(:first-child) { margin-top: 16px; }

/* 参数页：当前版式卡片 */
.current-layout {
  display: flex; align-items: center; gap: 10px; margin: 0 0 8px; padding: 6px 8px;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
}
.current-layout .layout-icon { width: 44px; height: 28px; color: var(--accent); flex: none; }
.cur-text { flex: 1; min-width: 0; }
.cur-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cur-meta { font-size: 12px; color: var(--faint); }

/* ---------- 画板多选 ---------- */
.marquee {
  position: absolute; z-index: 3; pointer-events: none;
  border: 1px solid var(--accent); background: rgba(124, 140, 255, .1); border-radius: 2px;
}
.board-item.selected { background: rgba(124, 140, 255, .06); }
.board-item.selected .menu-check { color: #8b96d9; }
.multi-banner {
  display: flex; align-items: flex-start; gap: 8px; margin: 6px 12px 0; padding: 8px 10px;
  border: 1px solid rgba(124, 140, 255, .45); border-radius: 9px; background: rgba(124, 140, 255, .1);
  color: var(--text); font-size: 12px; line-height: 1.5;
}
.multi-banner > .icon { color: var(--accent); margin-top: 2px; flex: none; }
.multi-banner > span { flex: 1; }
.multi-banner .btn { flex: none; margin: -2px -4px 0 0; }

/* ---------- 右键菜单 ---------- */
.ctx-menu { min-width: 230px; max-width: 320px; transform: none; transition: none; }
.menu-item.danger { color: #ff8a8a; }
.menu-item.danger .menu-check { color: #ff8a8a; }
.menu-item.danger:hover { background: rgba(255, 107, 107, .12); }
.menu-item:disabled { opacity: .4; cursor: default; }

/* ---------- 左右栏折叠（Tab / Shift+Tab） ---------- */
.app { transition: grid-template-columns .18s ease; }
body.resizing .app { transition: none; }
.app.left-hidden .sidebar.left, .app.right-hidden .sidebar.right { visibility: hidden; border: 0; }
.app.left-hidden .gutter-left, .app.right-hidden .gutter-right { display: none; }
.rp-tabs { grid-template-columns: 1fr 1fr auto; align-items: center; }
.rp-tabs .panel-collapse { width: 28px; height: 28px; color: var(--faint); }
.slides-head .panel-collapse { width: 28px; height: 28px; color: var(--muted); margin-left: 2px; }
.panel-collapse:hover { color: var(--text) !important; background: var(--panel-2) !important; }
.edge-tab {
  position: absolute; z-index: 8; top: 50%; transform: translateY(-50%);
  width: 22px; height: 56px; display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--line-2); background: rgba(21, 24, 30, .95); color: var(--muted); cursor: pointer;
  box-shadow: 0 6px 18px rgba(0, 0, 0, .4);
}
.edge-tab:hover { color: var(--text); background: var(--panel-2); }
.edge-left { left: 0; border-left: 0; border-radius: 0 8px 8px 0; }
.edge-right { right: 0; border-right: 0; border-radius: 8px 0 0 8px; }

html, body { touch-action: manipulation; overscroll-behavior: none; } /* 禁止双击缩放和回弹 */

/* ---------- 撤销 / 重做 ---------- */
.history-btns { display: inline-flex; gap: 1px; margin-left: 2px; }
.history-btns .icon-btn.visible { width: 28px; height: 28px; color: var(--muted); }
.history-btns .icon-btn.visible:hover:not(:disabled) { color: var(--text); background: var(--panel-2); }
.history-btns .icon-btn:disabled { opacity: .3; cursor: default; }

/* ---------- 吸附参考线 / 对齐 ---------- */
.guide-layer { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.guide { position: absolute; background: #ff3fa4; box-shadow: 0 0 0 .5px rgba(255, 63, 164, .4); }
.tb-btn.active-soft { color: var(--accent); }
.tb-btn:disabled { opacity: .3; cursor: default; }
.tb-btn:disabled:hover { background: transparent; color: var(--muted); }


/* ================= 右栏：竖排图标栏 + 页面标题（参照 Screen Studio） ================= */
.sidebar.right.right-panel { display: flex; flex-direction: row; overflow: hidden; }
.rp-tabs.rp-rail {
  flex: none; display: flex; flex-direction: column; align-items: center; gap: 8px; width: 56px;
  margin: 0; padding: 12px 0; border: 0; border-right: 1px solid var(--line); border-radius: 0; background: var(--bg);
}
.rp-rail .rp-tab {
  position: relative; width: 38px; height: 38px; padding: 0; border: 0; border-radius: 11px;
  display: flex; align-items: center; justify-content: center; background: transparent; color: var(--muted); cursor: pointer; box-shadow: none;
}
.rp-rail .rp-tab:hover { background: var(--panel-2); color: var(--text); }
.rp-rail .rp-tab.active { background: #f2f3f5; color: #111318; box-shadow: none; }
.rp-rail .tab-count {
  position: absolute; top: -4px; right: -6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--accent); color: #fff; font-size: 12px; line-height: 18px; text-align: center;
}
.rp-rail .tab-count:empty { display: none; }
.rp-rail .panel-collapse { margin-top: auto; width: 38px; height: 38px; border-radius: 11px; }
.rp-main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.rp-title { flex: none; padding: 16px 16px 12px; font-size: 16px; font-weight: 700; color: var(--text); }
.rp-main .rp-pane { padding-top: 0; }
.current-layout { background: var(--panel-2); border: 0; border-radius: 10px; padding: 8px 10px; }
.sel-bar { padding: 8px 16px 12px; }
.ctrls .text-input.textarea { border: 0; border-radius: 10px; background: var(--panel-2); padding: 10px 12px; font-size: 13px; }
.ctrls .text-input.textarea:focus { box-shadow: inset 0 0 0 1px var(--accent); }

/* ================= 统一风格（与右栏一致）：左侧工具栏、顶部工具条、顶栏、左栏 =================
 * 圆角 10~14px，控件是无描边的深色底块，选中项白底深色图标，文字 13px，数值加粗
 */
:root {
  --field: var(--panel-2);
  --field-hover: #222733;
  --chip-on: #f2f3f5;
  --chip-on-fg: #111318;
  --float-bg: rgba(21, 24, 30, .94);
}

/* ---------- 浮动面板外壳：左侧工具栏、顶部工具条 ---------- */
.toolstrip, .toolbar {
  background: var(--float-bg); backdrop-filter: blur(10px);
  border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
}
.toolstrip { gap: 4px; padding: 6px; top: 64px; }
.toolbar { gap: 8px; padding: 5px; }

/* ---------- 工具按钮：选中为白底 ---------- */
.tb-btn { height: 34px; min-width: 34px; padding: 0 8px; border-radius: 10px; color: var(--muted); }
.tb-btn:hover { background: var(--field); color: var(--text); }
.tb-btn.active { background: var(--chip-on); color: var(--chip-on-fg); }
.tb-btn.active-soft { color: var(--accent); background: rgba(124, 140, 255, .12); }
.toolstrip .tb-btn { width: 38px; min-width: 38px; height: 38px; border-radius: 11px; }
.ts-sep { width: 22px; height: 1px; margin: 4px 0; background: var(--line-2); }
.tb-group + .tb-group { padding-left: 8px; border-left: 1px solid var(--line); }
.tb-sep { height: 20px; background: var(--line); }
.tb-zoom { height: 34px; min-width: 52px; border-radius: 10px; font-size: 13px; font-weight: 600; }
.tb-zoom:hover { background: var(--field); }
.tb-text { font-size: 13px; }
.tb-bg { padding: 0 6px 0 7px; }
.bg-swatch { width: 20px; height: 20px; border-radius: 6px; }

/* ---------- 顶部工具条里的参数：紧凑版的数值条 / 分段按钮 / 输入条 ---------- */
.ctx-title { font-size: 13px; color: var(--muted); padding: 0 6px 0 8px; }
.ctx-controls.ctrls-inline { gap: 6px; }
.ctx-controls.ctrls-inline .ctrl { display: flex; align-items: center; gap: 6px; height: 34px; margin: 0; padding: 0; border-radius: 10px; background: none; }
.ctx-controls.ctrls-inline .ctrl-label { font-size: 13px; color: var(--muted); }
.ctx-controls.ctrls-inline .ctrl.sfield {
  position: relative; overflow: hidden; width: 150px; padding: 0 12px; background: var(--field);
  cursor: ew-resize; touch-action: none; outline: none; justify-content: space-between;
}
.ctx-controls.ctrls-inline .ctrl.sfield:hover, .ctx-controls.ctrls-inline .ctrl.sfield.dragging { background: var(--field-hover); }
.ctx-controls.ctrls-inline .sfield .ctrl-label, .ctx-controls.ctrls-inline .sfield .ctrl-value { position: relative; }
.ctx-controls.ctrls-inline .sfield .ctrl-value { min-width: 0; font-size: 13px; font-weight: 600; color: var(--text); }
.ctx-controls.ctrls-inline .ctrl.nfield { width: 112px; padding: 0 4px 0 12px; background: var(--field); }
.ctx-controls.ctrls-inline .nfield .ctrl-actions { flex: 1; display: flex; justify-content: flex-end; }
.ctx-controls.ctrls-inline .nfield .num-input { width: 100%; height: 30px; border: 0; background: transparent; text-align: right; font-weight: 600; font-size: 13px; padding: 0 6px; }
.ctx-controls.ctrls-inline .nfield .ctrl-unit { display: none; }
.ctx-controls.ctrls-inline .seg { height: 34px; padding: 3px; }
.ctx-controls.ctrls-inline .seg-btn { height: 28px; padding: 0 10px; flex: none; }
.ctx-controls.ctrls-inline .select { height: 34px; padding: 0 10px; border: 0; border-radius: 10px; background: var(--field); font-size: 13px; max-width: 140px; }
.ctx-controls.ctrls-inline .font-btn { height: 34px; border: 0; border-radius: 10px; background: var(--field); max-width: 160px; }
.ctx-controls.ctrls-inline .ctrl-color { gap: 8px; padding: 0 4px 0 10px; background: var(--field); }
.ctx-controls.ctrls-inline input[type=color] { width: 26px; height: 26px; padding: 0; border: 0; border-radius: 8px; background: none; cursor: pointer; }
.ctx-controls.ctrls-inline input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }

/* ---------- 顶栏 ---------- */
.topbar { padding: 0 12px 0 14px; }
.brand { font-size: 15px; font-weight: 700; }
.project-btn { height: 34px; padding: 0 10px; border: 0; border-radius: 10px; font-size: 13px; }

.topbar-group { gap: 2px; padding: 3px; background: var(--field); border: 0; border-radius: 12px; }
.topbar-btn { height: 30px; padding: 0 10px; border-radius: 9px; font-size: 13px; }
.topbar-btn:hover, .topbar-btn.open { background: var(--field-hover); }
.topbar-divider { background: var(--line-2); }
.export-group { height: 36px; border: 0; border-radius: 12px; background: var(--field); padding: 3px; gap: 2px; align-items: stretch; }

.eg-toggle { width: 32px; border: 0; border-radius: 9px; }
.eg-toggle:hover { background: var(--field-hover); }
.eg-btn { border: 0; border-radius: 9px; padding: 0 12px; font-size: 13px; }
.eg-btn:hover { background: var(--field-hover); }

/* ---------- 左栏：与右栏一样的页面标题、按钮、卡片 ---------- */
.slides-head { padding: 12px 10px 10px 16px; border-bottom: 0; }

.slides-head h2 .count { font-size: 12px; font-weight: 600; }
.head-actions { gap: 2px; }
.head-actions > .icon-btn.visible, .slides-head .panel-collapse { width: 32px; height: 32px; border-radius: 10px; }
.view-toggle { padding: 3px; gap: 2px; background: var(--field); border: 0; border-radius: 10px; }
.view-toggle .icon-btn.visible { width: 28px; height: 26px; border-radius: 8px; }
.view-toggle .icon-btn.visible.active { background: #2c3240; color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .35); }
.dropzone { border-radius: 14px; border-color: var(--line-2); background: rgba(255, 255, 255, .02); }
.dropzone.compact { border-radius: 12px; }
.dz-actions .btn { border: 0; background: var(--field); height: 34px; }
.dz-actions .btn:hover { background: var(--field-hover); }
.slide-item { border-radius: 10px; }
.slides-foot { padding: 10px 16px; }

/* ---------- 菜单 / 弹出层的圆角也统一 ---------- */
.menu, .popover { border-radius: 14px; }
.menu-item { border-radius: 9px; }
/* 工具条里：下拉、分段、颜色、字体不显示名称（悬停有提示），数值条 / 输入条的名称在条内 */
.ctx-controls.ctrls-inline .ctrl-select > .ctrl-label,
.ctx-controls.ctrls-inline .ctrl-color > .ctrl-label,
.ctx-controls.ctrls-inline .ctrl-font > .ctrl-label { display: none; }
.ctx-controls.ctrls-inline .ctrl-color { padding: 0 4px; }
.ctx-controls.ctrls-inline .ctrl.sfield { width: 132px; }
.ctx-controls.ctrls-inline .ctrl.nfield { width: 96px; }
.ctx-controls.ctrls-inline .font-btn { max-width: 132px; }
.ctx-controls.ctrls-inline .seg-btn { padding: 0 8px; }
.ctx-title { display: none; }

/* 画布右下角的视图条：吸附开关 + 视图缩放 */
.viewbar {
  position: absolute; z-index: 6; bottom: 14px; right: calc(var(--right-w, 340px) + 14px);
  display: flex; align-items: center; gap: 4px; padding: 4px;
  background: var(--float-bg); backdrop-filter: blur(10px);
  border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
}
.viewbar .tb-group + .tb-group { padding-left: 4px; }
.viewbar .tb-btn { height: 32px; min-width: 32px; }
.viewbar .tb-zoom { height: 32px; }
/* 下拉按钮（对齐、排列、布尔运算） */
.tb-menu-btn { gap: 2px; padding: 0 6px 0 8px; }
.tb-menu-btn .icon:last-child { color: var(--faint); }
.align-menu { min-width: 0; padding: 8px; }
.align-grid { display: grid; grid-template-columns: repeat(3, 40px); gap: 4px; margin-bottom: 4px; }
.align-grid.two { grid-template-columns: repeat(2, 40px); }
.align-cell {
  display: flex; align-items: center; justify-content: center; width: 40px; height: 36px;
  border: 0; border-radius: 10px; background: var(--field); color: var(--muted); cursor: pointer;
}
.align-cell:hover:not(:disabled) { background: var(--field-hover); color: var(--text); }
.align-cell:disabled { opacity: .35; cursor: default; }
/* 画布底部的操作提示让开右下角的视图条 */
.stage .stage-hint { max-width: calc(100% - 360px); }
.seg-btn.icon-only { display: inline-flex; align-items: center; justify-content: center; }
.ctx-controls.ctrls-inline .seg-btn.icon-only { width: 32px; padding: 0; }
.ctx-controls.ctrls-inline .ctrl-select .select { max-width: 92px; }
.ctx-controls.ctrls-inline .select { min-width: 0; }

/* 右栏图标栏：分组分隔线、底部的「偏好」 */
.rp-tabs.rp-rail { gap: 6px; overflow-y: auto; scrollbar-width: none; }
.rp-tabs.rp-rail::-webkit-scrollbar { display: none; }
.rp-rail .rp-tab { flex: none; }
.rp-sep { flex: none; width: 22px; height: 1px; margin: 4px 0; background: var(--line-2); }
.rp-rail .rp-tab.rp-bottom { margin-top: auto; }
.rp-rail .panel-collapse { margin-top: 0; flex: none; }
.page-body { padding: 8px 16px 20px; }
.rp-main > .multi-banner { margin: 4px 16px 6px; }
.rp-pane.flash { animation: section-flash .9s ease; }
.ctx-controls.ctrls-inline .ctrl.sfield { width: 116px; }
.ctx-controls.ctrls-inline { gap: 4px; }
.ctx-controls.ctrls-inline .ctrl.sfield { width: 104px; padding: 0 10px; }
.ctx-controls.ctrls-inline .ctrl.nfield { width: 84px; padding: 0 2px 0 10px; }

/* 按住参数名称拖动调整数值（类似 Photoshop） */
.ctrl-label.scrub { cursor: ew-resize; touch-action: none; }
.ctrl-label.scrub:hover { color: var(--text); }
body.scrubbing, body.scrubbing * { cursor: ew-resize !important; user-select: none !important; }

/* 面板参数：行间距加大，控件高度 34px */
.ctrls { row-gap: 12px; }
.ctrls .ctrl { min-height: 34px; }
.ctrls .ctrl.sfield, .ctrls .ctrl.nfield { height: 34px; }
.ctrls .ctrl .select, .ctrls .ctrl .font-btn, .hex-input { height: 34px; }
.color-field input[type=color] { width: 34px; height: 34px; }
.seg-btn { height: 28px; }
.ctrls .ctrl.stacked { gap: 6px; }

/* 左栏底部固定的操作栏 */
.slides-bar {
  flex: none; display: flex; align-items: center; gap: 2px;
  padding: 8px 10px; border-top: 1px solid var(--line); background: var(--panel);
}
.slides-bar .bar-spacer { flex: 1; }
.slides-bar > .icon-btn.visible { width: 34px; height: 34px; border-radius: 10px; color: var(--muted); }
.slides-head { justify-content: space-between; }
/* 画布底部的操作提示：画布太窄时隐藏（否则会被挤成一个字一行的竖排） */
.stage { container-type: inline-size; }
@container (max-width: 760px) { .stage .stage-hint { display: none; } }

/* 左栏空状态：拖入区上下居中，内容只留图标、标题、一行说明和两个按钮 */
.slides-scroll:has(> .dropzone:not(.compact)) { display: flex; flex-direction: column; justify-content: center; padding: 16px; }
.dropzone:not(.compact) {
  display: flex; flex-direction: column; align-items: center;
  padding: 32px 18px 20px; border-radius: 16px; border-color: var(--line-2);
}
.dropzone:not(.compact) .dz-icon {
  width: 52px; height: 52px; margin: 0 0 16px; border-radius: 14px;
  align-items: center; background: var(--field); color: var(--muted);
}
.dropzone:not(.compact) .dz-title { font-size: 14px; font-weight: 600; color: var(--text); }
.dropzone:not(.compact) .dz-sub { margin-top: 6px; font-size: 12px; line-height: 1.5; color: var(--faint); }
.dropzone:not(.compact) .dz-actions { flex-direction: column; gap: 8px; width: 100%; margin-top: 22px; }
.dropzone:not(.compact) .dz-actions .btn {
  height: 36px; padding: 0 12px; border: 0; border-radius: 10px; background: var(--field); font-size: 13px;
}
.dropzone:not(.compact) .dz-actions .btn:hover { background: var(--field-hover); }
.dropzone:not(.compact) .dz-actions .btn:first-child { background: #2c3240; }
.dropzone:not(.compact) .dz-actions .btn:first-child:hover { background: #343b4b; }
.dropzone:not(.compact) .dz-actions .btn { background: #252a35; }
.dropzone:not(.compact) .dz-actions .btn:hover { background: #2f3644; }
.dropzone:not(.compact) .dz-actions .btn { flex: none; width: 100%; }
/* 空状态更简洁：没有外框和底色，图标不加底块；拖文件进来时才显示高亮的虚线框 */
.dropzone:not(.compact) { border-color: transparent; background: transparent; padding: 0 6px; }
.dropzone:not(.compact) .dz-icon { width: auto; height: auto; margin-bottom: 14px; background: none; color: var(--faint); }
.file-drag .dropzone:not(.compact) { border-color: var(--accent); background: rgba(124, 140, 255, .06); padding: 24px 6px; }
/* 版式页的分组标题（平面 / 3D 透视）：可折叠 */
.picker-group { margin-bottom: 10px !important; }
.picker-grid[hidden] { display: none; }

/* 页面底部固定栏（「我的版式」的保存 / 导入 / 导出）：上面的内容单独滚动 */
.rp-pane.has-footer { display: flex; flex-direction: column; overflow: hidden; }
.rp-pane.has-footer[hidden] { display: none; }
.rp-pane.has-footer > .pane-body { flex: 1; min-height: 0; overflow-y: auto; }
.rp-footer { flex: none; display: flex; flex-direction: column; gap: 8px; padding: 10px 16px 12px; border-top: 1px solid var(--line); background: var(--panel); }
.rp-footer[hidden] { display: none; }
.rp-footer .preset-toolbar { margin: 0; gap: 4px; }
.rp-footer .preset-toolbar .btn { height: 34px; border: 0; border-radius: 10px; background: #252a35; font-size: 13px; }
.rp-footer .preset-toolbar .btn:hover { background: #2f3644; }
.rp-footer .preset-toolbar .icon-btn.visible { width: 34px; height: 34px; border-radius: 10px; }
.rp-footer .preset-form { margin: 0; border: 0; border-radius: 12px; }
/* 空状态的两个按钮：并排、接近正方形，图标在上、文字在下 */
.dropzone:not(.compact) .dz-actions { flex-direction: row; gap: 8px; }
.dropzone:not(.compact) .dz-actions .btn {
  flex: 1 1 0; width: auto; height: auto; aspect-ratio: 6 / 5; min-width: 0;
  flex-direction: column; justify-content: center; gap: 8px; padding: 0 6px;
}
.dropzone:not(.compact) .dz-actions .btn .icon { margin: 0; opacity: 1; color: var(--muted); }
.dropzone:not(.compact) .dz-actions .btn:hover .icon { color: var(--text); }

/* 顶栏中间：项目 · 保存状态 · 画板 / 比例 */
.topbar-center { align-items: center; gap: 8px; }
.topbar-center .save-status { margin-right: 4px; }
/* 视图条里的撤销 / 重做 */
.viewbar .history-btns { gap: 2px; margin: 0; }
.viewbar .history-btns .icon-btn.visible { width: 32px; height: 32px; border-radius: 10px; color: var(--muted); }
.viewbar .history-btns .icon-btn.visible:hover:not(:disabled) { background: var(--field); color: var(--text); }
/* 操作提示放在画布左下角，让开右下角的视图条（撤销 / 吸附 / 缩放） */
.stage .stage-hint { left: 16px; transform: none; text-align: left; max-width: calc(100% - 420px); }
.stage.long .stage-hint { left: calc(var(--left-w, 248px) + 16px); transform: none; }
/* 空状态按钮：只有图标的小方块，并排居中 */
.dropzone:not(.compact) .dz-actions { justify-content: center; gap: 10px; margin-top: 20px; }
.dropzone:not(.compact) .dz-actions .btn { flex: none; width: 56px; height: 48px; aspect-ratio: auto; padding: 0; gap: 0; }
/* 空状态按钮：平时透明，悬停时显示底色 */
.dropzone:not(.compact) .dz-actions .btn,
.dropzone:not(.compact) .dz-actions .btn:first-child { background: transparent; transition: background .15s, color .15s; }
.dropzone:not(.compact) .dz-actions .btn:hover,
.dropzone:not(.compact) .dz-actions .btn:first-child:hover { background: var(--field-hover); }
/* 画板背景快捷面板：一个色块网格 + 底部一行（自定义色、图片、幻灯片、更多） */
.bg-menu { width: 236px; padding: 10px; }
.bg-menu .menu-title { padding: 0 2px 8px; }
.bg-menu .bg-grid { grid-template-columns: repeat(6, 1fr); gap: 6px; }
.bg-foot { display: flex; align-items: center; gap: 4px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.bg-foot input[type=color] { width: 26px; height: 26px; }
.bg-foot .bar-spacer { flex: 1; }
.bg-foot-btn { width: 30px; height: 30px; color: var(--muted); }
.bg-foot-btn:hover { color: var(--text); }
.bg-foot-btn.on { background: var(--chip-on); color: var(--text); }
/* 工具条上的可折叠按钮组：宽度够时整排显示，放不下时折叠成下拉按钮 */
.tb-fold { display: flex; align-items: center; }
.tb-fold-inline { display: flex; align-items: center; gap: 2px; }
.tb-fold:not(.folded) > .tb-fold-menu, .tb-fold.folded > .tb-fold-inline { display: none; }
.tb-fold-inline .tb-btn:disabled { opacity: .35; cursor: default; background: none; }
.tb-fold-gap { width: 1px; height: 18px; margin: 0 4px; background: var(--line); flex: none; }
/* 数字输入框：去掉浏览器自带的上下箭头（会盖住数值）；未输入时可左右拖动调数值 */
.num-input { -moz-appearance: textfield; appearance: textfield; }
.num-input::-webkit-inner-spin-button, .num-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.num-input.scrub-input:not(:focus) { cursor: ew-resize; }
/* 右栏参数悬停（可用滚轮调）：只给输入框 / 数值条描边，不再给整行加左侧色条和底色（叠在标题上像个色块） */
.ctrls .ctrl.wheel-armed { background: none; box-shadow: none; }
/* 左栏顶部：当前画板的图片来源 */
.slides-mode { display: flex; align-items: center; gap: 4px; margin: 0 12px 8px; padding: 6px 6px 6px 10px; border-radius: 10px; background: var(--field); color: var(--muted); font-size: 12px; }
.slides-mode[hidden] { display: none; }
.slides-mode .sm-text { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slides-mode .sm-text .icon { flex: none; }
.slides-mode.own { background: rgba(240, 179, 90, .12); color: #f0b35a; }
.slides-mode .btn.small { flex: none; padding: 3px 8px; font-size: 12px; color: var(--text); }
.slides-mode.own { flex-wrap: wrap; row-gap: 6px; padding: 8px 8px 8px 10px; }
.slides-mode.own .sm-text { flex: 1 0 100%; white-space: normal; }
.slides-mode.own .btn.small { flex: 1; justify-content: center; background: rgba(255, 255, 255, .06); }
.slides-mode.own .btn.small:hover { background: rgba(255, 255, 255, .12); }
/* 设计页：内容单独滚动，底部固定「保存当前版式」 */
.rp-pane.has-footer > .design-body { flex: 1; min-height: 0; overflow-y: auto; }
.design-footer .preset-toolbar .btn { flex: 1; justify-content: center; }
.preset-toolbar-note { flex: 1; font-size: 12px; color: var(--faint); }
/* 渐隐遮罩菜单：10 个预设排成 5 × 2 */
.bg-menu.fade-menu { width: 336px; }
.fade-menu .fade-grid { grid-template-columns: repeat(5, 1fr); }
.fade-menu .fade-chip { padding: 6px 2px 5px; white-space: nowrap; }
/* 样机页：设备卡片 */
.mockup-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 14px; }
.mockup-card {
  display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 6px 10px;
  border: 0; border-radius: 12px; background: var(--field); color: var(--muted); font-size: 13px; cursor: pointer;
}
.mockup-card:hover { background: var(--field-hover); color: var(--text); }
.mockup-thumb { width: 100%; max-width: 132px; aspect-ratio: 132 / 96; display: block; }
.mockup-upload { width: 100%; height: 38px; margin-top: 10px; border: 0; border-radius: 10px; background: var(--field); justify-content: center; gap: 6px; }
.mockup-upload:hover { background: var(--field-hover); }
.mockup-sub { margin-top: 16px; }
.mockup-name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mockup-grid[hidden], .mockup-sub[hidden] { display: none; }
/* 设计页：样机屏幕图片 */
.device-image-row { display: flex; gap: 6px; padding: 0 16px 16px; }
.device-image-row[hidden] { display: none; }
.device-image-row .btn { flex: 1; height: 34px; border: 0; border-radius: 10px; background: var(--field); justify-content: center; gap: 6px; font-size: 13px; }
.device-image-row .btn:hover { background: var(--field-hover); }
/* 标出 PNG 样机屏幕区域的弹窗 */
.qp-backdrop { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; background: rgba(5, 6, 9, .62); backdrop-filter: blur(4px); }
.qp-dialog { display: flex; flex-direction: column; gap: 12px; max-width: 92vw; padding: 16px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 24px 60px rgba(0, 0, 0, .5); }
.qp-title { font-size: 16px; font-weight: 700; color: var(--text); }
.qp-hint { margin-top: 4px; font-size: 12px; color: var(--muted); max-width: 720px; line-height: 1.5; }
.qp-stage { display: flex; justify-content: center; border-radius: 10px; overflow: hidden; background: #0d0f13; }
.qp-canvas { display: block; touch-action: none; }
.qp-foot { display: flex; align-items: center; gap: 8px; }
.qp-foot .bar-spacer { flex: 1; }
.qp-foot .btn { height: 34px; padding: 0 14px; border-radius: 10px; gap: 6px; }
.qp-preview { display: flex; align-items: center; gap: 8px; margin-left: 6px; font-size: 13px; color: var(--muted); }

</style>

<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="topbar-left">
        <div class="brand"><span class="logo" data-icon="layout-grid" data-icon-size="13"></span>SlideGrid</div>
        <!-- 撤销 / 重做：启动后移到画布右下角的视图条里 -->
        <div class="history-btns tb-group">
          <button class="icon-btn visible" id="undo-btn" data-icon="undo-2" data-icon-size="16" aria-label="撤销" disabled></button>
          <button class="icon-btn visible" id="redo-btn" data-icon="redo-2" data-icon-size="16" aria-label="重做" disabled></button>
        </div>
      </div>
      <!-- 中间：项目（保存状态）· 画板 / 比例菜单（由 topbarMenus 追加在后面） -->
      <div class="topbar-center" id="board-bar">
        <button class="project-btn" id="project-btn" data-icon="folder-kanban" title="项目：新建、打开、导入、导出">
          <span class="project-title" id="project-title">…</span>
          <span class="caret" data-icon="chevron-down" data-icon-size="14"></span>
        </button>
        <span class="save-status" id="save-status"></span>
      </div>
      <div class="topbar-right">
        <div class="export-group">
          <div class="size-picker" id="size-picker" title="导出尺寸：普通画布为长边，长图为宽度"></div>
          <button class="eg-btn" id="copy-btn" data-icon="clipboard-copy" data-icon-size="15" title="把当前画板按所选尺寸复制为 PNG">复制</button>
        </div>
        <button class="btn primary" id="export-btn" data-icon="download">导出</button>
      </div>
    </header>

    <aside class="sidebar left" id="slides-panel">
      <div class="slides-head">
        <h2 title="当前画板用到的图片。画板默认共用这份列表；在画布上单独交换 / 替换 / 移除某张卡片后，这个画板改为单独设置">幻灯片<span class="count" id="slide-count"></span></h2>
      </div>
      <!-- 当前画板的图片来源：跟随共用列表 / 单独设置（js/main.js 更新） -->
      <div class="slides-mode" id="slides-mode" hidden></div>

      <div class="slides-scroll">
        <div class="dropzone" id="dropzone">
          <div class="dz-icon" data-icon="images" data-icon-size="32"></div>
          <div class="dz-title">拖入图片或文件夹</div>
