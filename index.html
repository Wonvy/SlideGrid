<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>SlideGrid</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="topbar-left">
        <div class="brand"><span class="logo" data-icon="layout-grid" data-icon-size="13"></span>SlideGrid</div>
        <!-- 撤销 / 重做：启动后移到画布右下角的视图条里 -->
        <div class="history-btns tb-group">
          <button class="icon-btn visible" id="undo-btn" data-icon="undo-2" data-icon-size="16" aria-label="撤销" disabled></button>
          <button class="icon-btn visible" id="redo-btn" data-icon="redo-2" data-icon-size="16" aria-label="重做" disabled></button>
        </div>
      </div>
      <!-- 中间：项目（保存状态）· 画板 / 比例菜单（由 topbarMenus 追加在后面） -->
      <div class="topbar-center" id="board-bar">
        <button class="project-btn" id="project-btn" data-icon="folder-kanban" title="项目：新建、打开、导入、导出">
          <span class="project-title" id="project-title">…</span>
          <span class="caret" data-icon="chevron-down" data-icon-size="14"></span>
        </button>
        <span class="save-status" id="save-status"></span>
      </div>
      <div class="topbar-right">
        <div class="export-group">
          <div class="size-picker" id="size-picker" title="导出尺寸：普通画布为长边，长图为宽度"></div>
          <button class="eg-btn" id="copy-btn" data-icon="clipboard-copy" data-icon-size="15" title="把当前画板按所选尺寸复制为 PNG">复制</button>
        </div>
        <button class="btn primary" id="export-btn" data-icon="download">导出</button>
      </div>
    </header>

    <aside class="sidebar left" id="slides-panel">
      <!-- 左栏顶部：标签切换「幻灯片 / 图层」（各占整栏高度），右边是收起按钮（main.js 追加） -->
      <div class="rp-top lp-top">
        <div class="rp-tabs" role="tablist">
          <button class="rp-tab" role="tab" data-tab="slides" title="当前画板用到的图片（当前图集）。画板默认跟随图集；在画布上单独替换 / 移除某张卡片后，这个画板改为单独设置">幻灯片<span class="tab-count" id="slide-count"></span></button>
          <button class="rp-tab" role="tab" data-tab="layers" title="当前画板的图层：上面的在前。拖动调整前后，右键更多操作，双击改名">图层<span class="tab-count" id="layer-count"></span></button>
        </div>
      </div>
      <div class="lp-page" id="page-slides" role="tabpanel">
      <!-- 图集切换（ui/albumBar.js） -->
      <div class="album-bar" id="album-bar"></div>
      <div class="v-split album-splitter" id="album-splitter" title="上下拖动调整图集区域的高度（双击恢复）"></div>
      <!-- 当前画板的图片来源：跟随图集 / 单独设置（js/main.js 更新） -->
      <div class="slides-mode" id="slides-mode" hidden></div>
      <!-- 图片列表的标题行：正在显示哪个图集、张数、显示方式 -->
      <div class="slides-subhead">
        <span class="sh-title" id="slides-subtitle">图片</span>
        <span class="sh-count" id="slides-foot"></span>
        <span class="bar-spacer"></span>
        <div class="view-toggle" role="group" aria-label="显示方式">
          <button class="icon-btn visible" id="view-grid" data-icon="layout-grid" data-icon-size="14" title="网格视图"></button>
          <button class="icon-btn visible" id="view-list" data-icon="list" data-icon-size="14" title="列表视图"></button>
        </div>
      </div>

      <div class="slides-scroll">
        <div class="dropzone" id="dropzone">
          <div class="dz-icon" data-icon="images" data-icon-size="32"></div>
          <div class="dz-title">拖入图片或文件夹</div>
          <div class="dz-sub">图片只在本地处理，不会上传</div>
          <div class="dz-actions">
            <button class="btn" data-action="pick-files" data-icon="image-plus" data-icon-size="20" title="选择图片" aria-label="选择图片"></button>
            <button class="btn" data-action="pick-folder" data-icon="folder-open" data-icon-size="20" title="选择文件夹" aria-label="选择文件夹"></button>
          </div>
          <div class="dz-compact" data-icon="plus" data-icon-size="14" title="点击选择图片，或把图片 / 文件夹拖进来">拖入或点击添加更多</div>
        </div>
        <ol class="slide-list" id="slide-list"></ol>
      </div>

      <!-- 底部固定的操作栏：添加、清空 -->
      <div class="head-actions slides-bar">
        <button class="btn sb-add" data-action="pick-files" data-icon="image-plus" data-icon-size="15" title="添加图片（也可以把图片 / 文件夹直接拖进来）">添加图片</button>
        <button class="icon-btn visible" data-action="pick-folder" data-icon="folder-open" data-icon-size="16" title="添加文件夹（会新建一个图集）"></button>
        <span class="bar-spacer"></span>
        <button class="icon-btn visible danger" id="clear-btn" data-icon="trash-2" data-icon-size="16" title="清空当前画板的全部图片（设置保留）"></button>
      </div>
      </div>
      <!-- 图层页：当前画板的图层列表（ui/inspector.js 填充） -->
      <div class="lp-page" id="page-layers" role="tabpanel" hidden>
        <div class="dock-body" id="layers-slot"></div>
      </div>
      <input type="file" id="file-input" accept="image/*" multiple hidden>
      <input type="file" id="folder-input" webkitdirectory multiple hidden>
    </aside>

    <main class="stage" id="stage">
      <div class="viewport" id="viewport">
        <canvas id="bg-canvas"></canvas>
        <canvas id="gl-canvas"></canvas>
        <canvas id="fg-canvas"></canvas>
      </div>
      <div class="stage-hint" id="stage-hint"></div>
    </main>

    <aside class="sidebar right" id="settings-panel"></aside>
  </div>

  <div class="drop-overlay" id="drop-overlay">
    <div class="drop-label"><span data-icon="upload"></span><span id="drop-label">松开以导入图片或文件夹</span></div>
  </div>
  <div class="toast" id="toast"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
